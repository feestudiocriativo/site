name: Sincronizar Behance e publicar site

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em São Paulo
  workflow_dispatch:        # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar projetos novos no Behance
        env:
          BEHANCE_USER: ${{ vars.BEHANCE_USER }}
        run: node scripts/sync-behance.mjs

      - name: Salvar a lista atualizada
        run: |
          if ! git diff --quiet site/projects.json; then
            git config user.name "behance-sync"
            git config user.email "behance-sync@users.noreply.github.com"
            git add site/projects.json
            git commit -m "Cases: novos projetos do Behance"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
